<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:"Schibsted Grotesk",sans-serif;color:#fff;position:relative;background:linear-gradient(160deg,#2b3a67 0%,#3d2f5c 40%,#7a4a5a 75%,#c47a5a 100%)}
body::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 110%,#00000066,transparent)}
.clock{position:absolute;left:0;right:0;top:170px;text-align:center}
.clock b{display:block;font:300 260px/0.9 "Schibsted Grotesk";letter-spacing:-.05em}
.clock span{display:block;margin-top:22px;font:500 34px "Schibsted Grotesk";color:#f1e4ec}
.hint{position:absolute;left:0;right:0;top:640px;text-align:center;font:500 28px "Schibsted Grotesk";color:#f6e9ef}
.hint b{font-weight:700;color:#fff}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;height:196px;padding:0 44px;border-radius:98px;background:#ffffff1f;box-shadow:inset 0 1px 0 #ffffff33,0 20px 50px #0004;display:flex;align-items:center;gap:36px;z-index:2}
.i{width:132px;height:132px;border-radius:50%;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px #0005;position:relative}
.i img{width:100%;height:100%;object-fit:cover}
.i.pr{background:#0a7cff}.i.pr img{width:86%;height:86%;object-fit:contain}
.i.nf img{width:88%;height:88%;object-fit:contain}
.i.ps{background:#003791;font:800 44px "Schibsted Grotesk"}
.sep{width:2px;height:96px;background:#ffffff40}
.s{width:96px;height:96px;border-radius:50%;background:#ffffff26;display:flex;align-items:center;justify-content:center}
.s svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.i.on{width:168px;height:168px;box-shadow:0 0 0 6px #fff,0 18px 40px #0007;transform:translateY(-26px)}
.lbl{position:absolute;left:50%;bottom:290px;transform:translateX(-50%);font:700 30px "Schibsted Grotesk";background:#00000055;padding:8px 22px;border-radius:24px;margin-left:-325px;z-index:3}
</style></head><body>
<div class="clock"><b>1:14</b><span>Thursday 22 October</span></div>
<div class="hint">YouTube &middot; last opened <b>last night, 9:40</b> &middot; <b>0.6 h</b> this week</div>
<div class="lbl">YouTube</div>
<div class="dock">
<div class="i on"><img src="img/i-youtube.png"></div>
<div class="i pr"><img src="img/i-prime.png"></div>
<div class="i nf"><img src="img/i-netflix.png"></div>
<div class="i ps">PS4</div>
<div class="sep"></div>
<div class="s"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M12 18v3"/></svg></div>
<div class="s"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></div>
<div class="s"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
</div>
</body></html>
