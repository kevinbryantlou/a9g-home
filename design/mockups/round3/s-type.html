<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:"Schibsted Grotesk",sans-serif;color:#fff;position:relative;background:radial-gradient(90% 120% at 85% 30%,#5c0f0f 0%,#2a0808 50%,#120606 100%)}
.clock{position:absolute;right:110px;top:80px;text-align:right}
.clock b{display:block;font:300 88px/1 "Schibsted Grotesk";letter-spacing:-.03em}
.clock span{font:500 24px "Schibsted Grotesk";color:#d9b3b3}
.list{position:absolute;left:110px;top:150px}
.it{font:700 96px/1.12 "Schibsted Grotesk";letter-spacing:-.035em;color:#ffffff40}
.it small{font:600 30px "Schibsted Grotesk";letter-spacing:0;margin-left:18px;vertical-align:middle}
.it.on{color:#fff;font-size:150px;line-height:1.05}
.it.on::before{content:"";display:inline-block;width:20px;height:20px;border-radius:50%;background:#ff3b30;margin-right:26px;vertical-align:middle;position:relative;top:-14px}
.side{position:absolute;right:110px;top:420px;width:560px}
.side img{width:560px;height:315px;border-radius:18px;display:block;box-shadow:0 30px 60px #0009}
.side p{margin-top:24px;font:500 28px/1.45 "Schibsted Grotesk";color:#e8cfcf}
.side p b{color:#fff}
.util{position:absolute;left:110px;bottom:70px;display:flex;gap:44px;font:600 28px "Schibsted Grotesk";color:#ffffff80}
</style></head><body>
<div class="clock"><b>1:14</b><span>Thursday 22 October</span></div>
<div class="list">
<div class="it on">YouTube</div>
<div class="it">Prime Video</div>
<div class="it">Netflix</div>
<div class="it">PS4<small>HDMI 2</small></div>
</div>
<div class="side"><img src="img/youtube.png"><p>Last opened <b>last night, 9:40</b><br><b>0.6 h</b> this week &nbsp;&middot;&nbsp; <b>22 h</b> this year</p></div>
<div class="util"><span>Inputs</span><span>All apps</span><span>Settings</span></div>
</body></html>
