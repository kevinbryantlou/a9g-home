<!doctype html><html><head><meta charset="utf-8"><title>B Row</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tiles.css"><style>
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#000;color:#fff;font-family:Roboto,sans-serif;overflow:hidden}
.time{position:absolute;left:144px;top:96px;font:300 120px/1 Roboto;letter-spacing:-.02em}
.date{position:absolute;left:150px;top:236px;font:400 30px Roboto;color:#8d8d8d}
.row{position:absolute;left:144px;top:430px;display:flex;gap:40px;align-items:center}
.t .bn{width:376px;height:212px;border-radius:12px;font-size:376px;transition:none}
.t.on .bn{transform:scale(1.1);box-shadow:0 0 0 5px #fff,0 18px 40px #000}
.name{position:absolute;left:144px;top:720px;font:500 36px Roboto}
.sub{position:absolute;left:144px;top:770px;font:400 26px Roboto;color:#8d8d8d}
.row2{position:absolute;left:144px;top:880px;display:flex;gap:18px}
.p{height:64px;padding:0 30px;border-radius:32px;background:#1c1c1c;display:flex;align-items:center;font:500 25px Roboto;color:#cfcfcf}
</style></head><body>
<div class="time">1:14</div><div class="date">Thursday, October 22</div>
<div class="row">
<div class="t"><div class="bn netflix"><span>NETFLIX</span></div></div>
<div class="t on"><div class="bn youtube"><span>YouTube</span></div></div>
<div class="t"><div class="bn prime"><span><b>prime</b> video</span></div></div>
<div class="t"><div class="bn ps"><span>PlayStation</span></div></div>
</div>
<div class="name">YouTube</div><div class="sub">Opens the app</div>
<div class="row2"><div class="p">Spotify</div><div class="p">Inputs</div><div class="p">All apps</div><div class="p">Settings</div><div class="p">Stock home</div></div>
</body></html>
