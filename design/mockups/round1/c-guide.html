<!doctype html><html><head><meta charset="utf-8"><title>C Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tiles.css"><style>
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#101418;color:#e9ecef;font-family:"Archivo",sans-serif;overflow:hidden}
.clock{position:absolute;right:120px;top:84px;text-align:right}
.clock b{display:block;font:700 64px/1 "Archivo";font-stretch:80%}
.clock span{font:500 26px "Archivo";color:#7d8791}
.list{position:absolute;left:120px;top:150px;width:640px}
.it{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:700 46px "Archivo";font-stretch:82%;color:#c4cbd2;border-bottom:1px solid #1f262d}
.it small{font:500 22px "Archivo";color:#6b757f;font-stretch:100%}
.it.on{background:#e9ecef;color:#101418;border-radius:4px;border-color:transparent}
.it.on small{color:#4b545d}
.it.minor{height:70px;font-size:34px;color:#97a1aa}
.gap{height:26px}
.hero{position:absolute;left:880px;top:236px;width:920px}
.hero .bn{width:920px;height:518px;border-radius:8px;font-size:920px}
.hero p{margin-top:28px;font:500 30px "Archivo";color:#9aa4ad}
</style></head><body>
<div class="clock"><b>1:14 PM</b><span>Thursday 22 October</span></div>
<div class="list">
<div class="it">Netflix</div>
<div class="it on">YouTube</div>
<div class="it">Prime Video</div>
<div class="it">PlayStation <small>HDMI 2</small></div>
<div class="gap"></div>
<div class="it minor">Spotify</div><div class="it minor">Inputs</div><div class="it minor">All apps</div><div class="it minor">Settings</div>
</div>
<div class="hero"><div class="bn youtube"><span>YouTube</span></div><p>Opens YouTube &middot; last used today</p></div>
</body></html>
